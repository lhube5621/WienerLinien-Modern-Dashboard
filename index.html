<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Öffi Monitor Wien Kompakt-Grid</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Edler, leicht aufgehellter Deep-Dark Hintergrund */
            --bg: #0d1117;
            --bg-capsule: #07090e;
            --panel: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            
            /* Text */
            --text: #ffffff;
            --text-soft: #b0b8c9;
            --text-muted: #6e7688;
            
            /* Farben mit Glow-Effekt */
            --green: #00f098;
            --tram: #e61428;
            --bus: #1a73e8;
            --ubahn-u3: #ff6a00;
            
            --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.4);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(255, 255, 255, 0.02) 0%, transparent 40%),
                radial-gradient(circle at 85% 100%, rgba(255, 255, 255, 0.01) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        body {
            padding: 16px 12px 24px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        /* --- TOPBAR --- */
        .topbar {
            margin-bottom: 20px;
            padding: 16px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: 1px solid var(--border-highlight);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft);
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #clock {
            font-size: clamp(2.8rem, 10vw, 3.8rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        #dateLine {
            margin-top: 6px;
            color: var(--text-soft);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .sync-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .sync-copy {
            display: flex;
            flex-direction: column;
        }

        .sync-label {
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        #lastUpdate {
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* --- DASHBOARD NEU: ZWEISPALTIGES GRID --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Genau 2 Spalten nebeneinander */
            gap: 12px; /* Schmalere Abstände für Kompaktheit */
        }

        /* U3 nimmt die volle Breite in Anspruch, weil sie am Ende steht */
        .station-card.ubahn {
            grid-column: span 2; 
        }

        .station-card {
            position: relative;
            overflow: hidden;
            padding: 14px;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent); /* Knackiger Leuchtrand links */
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
        }

        .station-card.tram { --accent: var(--tram); box-shadow: 0 4px 15px rgba(230, 20, 40, 0.05); }
        .station-card.bus { --accent: var(--bus); box-shadow: 0 4px 15px rgba(26, 115, 232, 0.05); }
        .station-card.ubahn.u3 { --accent: var(--ubahn-u3); box-shadow: 0 4px 15px rgba(255, 106, 0, 0.05); }
        .station-card.missing { --accent: #4a5060; }

        /* Kompakte obere Zeile im Widget */
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        /* Kompakte Glas-Plakette */
        .line-badge {
            min-width: 52px;
            height: 42px;
            padding: 0 8px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            text-shadow: 0 0 8px var(--accent);
        }

        .type-icon {
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .type-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        .info {
            min-width: 0;
            margin-top: 2px;
        }

        .direction {
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            word-break: break-word;
        }

        /* Die fette Zeitanzeige im Widget */
        .time-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            gap: 4px;
        }

        .time-value {
            font-size: 2.8rem;
            line-height: 0.85;
            font-weight: 800;
            letter-spacing: -0.05em;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }

        .time-value.soon {
            color: var(--green);
        }

        .time-unit {
            font-size: 0.75rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        /* Die kompakteren Folgezeiten im Widget unten */
        .secondary-times {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            width: 100%;
        }

        .secondary-pill {
            color: var(--text-soft);
            font-size: 0.76rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .secondary-pill strong {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .loading-card, .error-msg {
            grid-column: span 2;
            padding: 30px 20px;
            border-radius: var(--radius-lg);
            background: var(--panel);
            border: 1px solid var(--border);
            text-align: center;
            font-weight: 600;
        }

        .loading-card { color: var(--text-soft); }
        .error-msg { color: #ff5e5e; }
    </style>
</head>

<body>
    <main class="app">
        <section class="topbar">
            <div class="topbar-row">
                <div class="clock-wrap">
                    <div id="clock">--:--</div>
                    <div id="dateLine">Lade Datum...</div>
                </div>

                <div class="sync-chip">
                    <div class="sync-dot"></div>
                    <div class="sync-copy">
                        <span class="sync-label">Live Sync</span>
                        <span id="lastUpdate">Lade...</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="dashboard" class="dashboard">
            <div class="loading-card">Lade Widget-Feed...</div>
        </section>
    </main>

    <script>
        const meineStationen = [
            { rbl: "571", linie: "10", richtung: "Unter St. Veit", name: "Linzer Straße" },
            { rbl: "578", linie: "10", richtung: "Dornbach", name: "Linzer Straße" },
            { rbl: "571", linie: "52", richtung: "Westbahnhof", name: "Linzer Straße" },
            { rbl: "578", linie: "52", richtung: "Baumgarten", name: "Linzer Straße" },
            { rbl: "902", linie: "10A", richtung: "Niederhofstraße", name: "Linzer Straße" },
            { rbl: "879", linie: "10A", richtung: "Heiligenstadt", name: "Linzer Straße" },
            { rbl: "4933", linie: "U3", richtung: "Simmering", name: "Hütteldorfer Straße" }
        ];

        // FIX: Kaskadierende Proxy-Liste eingebaut, falls einer blockiert oder offline ist
        function baueApiUrls() {
            const rbls = [...new Set(meineStationen.map(station => station.rbl))];
            const params = rbls.map(id => `rbl=${encodeURIComponent(id)}`).join("&");
            const wlUrl = `https://www.wienerlinien.at/ogd_realtime/monitor?${params}&_=${Date.now()}`;

            return [
                wlUrl, // 1. Direkter Aufruf
                "https://corsproxy.io/?" + encodeURIComponent(wlUrl), // 2. Haupt-Proxy
                "https://api.allorigins.win/raw?url=" + encodeURIComponent(wlUrl), // 3. Backup-Proxy (Cache-sicher)
                "https://thingproxy.freeboard.io/fetch/" + wlUrl // 4. Letzter Notnagel
            ];
        }

        function bestimmeKachelTyp(linie) {
            if (linie.startsWith("U")) return "ubahn " + linie.toLowerCase();
            if (linie.endsWith("A") || linie.endsWith("B")) return "bus";
            return "tram";
        }

        function holeTypIcon(linie) {
            if (linie.startsWith("U")) {
                return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 9v4a4 4 0 0 0 8 0V9"></path></svg>`;
            }
            if (linie.endsWith("A") || linie.endsWith("B")) {
                return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6.5" width="16" height="10" rx="3"></rect><path d="M7 16.5v2M17 16.5v2M4 11h16"></path></svg>`;
            }
            return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="11" rx="2.5"></rect><path d="M8 16v2M16 16v2M7 19h10M8 9h8"></path></svg>`;
        }

        function formatGroßeZeit(min) {
            if (min === undefined || min === null || min === "—") return "—";
            const num = Number(min);
            if (Number.isNaN(num)) return String(min);
            return num <= 0 ? "0" : String(num);
        }

        function formatZeitEinheit(min) {
            if (min === undefined || min === null || min === "—") return "";
            const num = Number(min);
            return !Number.isNaN(num) && num <= 0 ? "SOFORT" : "MIN";
        }

        function istBald(min) {
            const num = Number(min);
            return !Number.isNaN(num) && num <= 3;
        }

        function erstelleSecondaryPills(zweiteZeit, dritteZeit) {
            const pills = [];
            if (zweiteZeit !== undefined && zweiteZeit !== null) {
                pills.push(`<div class="secondary-pill"><span>Nächste:</span> <strong>${zweiteZeit} min</strong></div>`);
            }
            if (dritteZeit !== undefined && dritteZeit !== null) {
                pills.push(`<div class="secondary-pill"><span>Danach:</span> <strong>${dritteZeit} min</strong></div>`);
            }
            return pills.length === 0 ? `<div class="secondary-pill">Keine weiteren Daten</div>` : pills.join("");
        }

        function erstelleKachel(wunsch, zeit, zweiteZeit, dritteZeit, istFehlend = false, infoText = "") {
            const typKlasse = bestimmeKachelTyp(wunsch.linie);
            const timeClass = istBald(zeit) && !istFehlend ? "time-value soon" : "time-value";

            const kachel = document.createElement("div");
            kachel.className = `station-card ${typKlasse} ${istFehlend ? "missing" : ""}`;

            kachel.innerHTML = `
                <div>
                    <div class="card-top">
                        <div class="line-badge"><span>${wunsch.linie}</span></div>
                        <div class="type-icon">${holeTypIcon(wunsch.linie)}</div>
                    </div>
                    <div class="info">
                        <div class="direction">${wunsch.richtung}</div>
                    </div>
                </div>

                <div>
                    <div class="time-row">
                        <div class="${timeClass}">${formatGroßeZeit(zeit)}</div>
                        <div class="time-unit">${istFehlend ? "" : formatZeitEinheit(zeit)}</div>
                    </div>

                    <div class="secondary-times">
                        ${istFehlend ? `<div class="secondary-pill">${infoText}</div>` : erstelleSecondaryPills(zweiteZeit, dritteZeit)}
                    </div>
                </div>
            `;
            return kachel;
        }

        // FIX: Geht alle Proxys nacheinander durch, falls einer offline meldet
        async function ladeApiDaten() {
            const apiUrls = baueApiUrls();
            let letzterFehler = null;
            for (const url of apiUrls) {
                try {
                    const response = await fetch(url, { cache: "no-store" });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const json = await response.json();
                    if (!json?.data?.monitors) throw new Error("Ungültige API");
                    return json;
                } catch (error) { 
                    letzterFehler = error; 
                }
            }
            throw new Error(letzterFehler?.message || "Fehler");
        }

        async function holeAbfahrten() {
            const dashboardContainer = document.getElementById("dashboard");
            const lastUpdate = document.getElementById("lastUpdate");

            try {
                const json = await ladeApiDaten();
                const monitors = json.data?.monitors || [];
                dashboardContainer.innerHTML = "";

                meineStationen.forEach(wunsch => {
                    let gefundeneLinie = null;
                    let gesammelteLinien = [];

                    for (const m of monitors) {
                        const apiRbl = m.locationStop?.properties?.attributes?.rbl || m.locationStop?.properties?.name;
                        if (String(apiRbl) !== String(wunsch.rbl)) continue;

                        const linien = m.lines || [];
                        linien.forEach(l => gesammelteLinien.push(`${l.name} → ${l.towards}`));
                        const match = linien.find(l => String(l.name) === String(wunsch.linie));
                        if (match) { gefundeneLinie = match; break; }
                    }

                    if (!gefundeneLinie) {
                        const infoText = gesammelteLinien.length > 0
                            ? "Keine aktuelle Abfahrt"
                            : "Keine Echtzeitdaten";

                        dashboardContainer.appendChild(
                            erstelleKachel(wunsch, "-", undefined, undefined, true, infoText)
                        );
                        return;
                    }

                    const abfahrtenArray = gefundeneLinie.departures?.departure || [];
                    const naechsteAbfahrt = abfahrtenArray[0]?.departureTime?.countdown ?? "—";
                    const zweiteAbfahrt = abfahrtenArray[1]?.departureTime?.countdown;
                    const dritteAbfahrt = abfahrtenArray[2]?.departureTime?.countdown;

                    dashboardContainer.appendChild(erstelleKachel(wunsch, naechsteAbfahrt, zweiteAbfahrt, dritteAbfahrt, false));
                });

                lastUpdate.textContent = new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            } catch (fehler) {
                dashboardContainer.innerHTML = `<div class="error-msg"><strong>FEED OFFLINE</strong></div>`;
                lastUpdate.textContent = "Fehler";
            }
        }

        function aktualisiereUhr() {
            const jetzt = new Date();
            document.getElementById("clock").textContent = jetzt.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
            document.getElementById("dateLine").textContent = jetzt.toLocaleDateString("de-AT", { weekday: "long", day: "2-digit", month: "long" });
        }

        aktualisiereUhr();
        setInterval(aktualisiereUhr, 1000);
        holeAbfahrten();
        setInterval(holeAbfahrten, 10000);
    </script>
</body>

</html>
